  <rect width="480" height="360" fill="url(#sky)"/>
  <circle cx="360" cy="96" r="54" fill="url(#sun)"/>

  <path d="M0 300 L120 150 L220 300 Z" fill="#0F172A" opacity="0.85"/>
  <path d="M150 300 L280 120 L420 300 Z" fill="#1E293B" opacity="0.9"/>
